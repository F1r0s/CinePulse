<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="LzpIrbxkTWGQ4E3seDYKr8RUUfTiuNsGKiQKLK_yqjk" />

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="unsafe-url" />
  <title>Redirecting... — CinePulse</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0e17;
      color: #fff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .redirect-box {
      text-align: center;
      padding: 40px;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(14, 165, 233, 0.15);
      border-top-color: #0ea5e9;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    p { font-size: 14px; color: rgba(255,255,255,0.5); }
  </style>
</head>
<body>
  <div class="redirect-box">
    <div class="spinner"></div>
    <h2>Redirecting...</h2>
    <p>Please wait while we take you to the offer.</p>
  </div>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var dest = params.get('url');
      if (dest) {
        setTimeout(function() {
          window.location.replace(dest);
        }, 800);
      } else {
        document.querySelector('h2').textContent = 'No destination';
        document.querySelector('p').textContent = 'Missing redirect URL.';
      }
    })();
  </script>
</body>
</html>
